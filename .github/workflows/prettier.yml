jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
      - name: Prepare actions
        uses: ./.github/actions/prepare
      - name: Prettier
        run: pnpm fmt --check --write=false
      - uses: mshick/add-pr-comment@v2
        if: failure()
        with:
          message-failure: |
            Uh oh! Prettier found some formatting issues. Please run `pnpm fix` and commit the changes.

name: Prettier

on:
  pull_request: ~
  merge_group: ~

  push:
    branches:
      - main
